name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Cache action videos
        uses: actions/cache@v4
        with:
          path: action-video-cache
          key: action-mp4-${{ hashFiles('scripts/build_action_site.py', 'GIF_MANIFEST.json') }}

      - name: Build optimized website
        run: |
          python3 scripts/build_action_site.py
          du -sh site-dist

      - name: Load 2026-11-25 Taiwan update in deployed index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site-dist')
          html = root / 'index.html'
          src = root / 'data/tw-update-20261125.js'
          if not src.is_file() or not src.stat().st_size:
              raise SystemExit('Missing site-dist/data/tw-update-20261125.js')
          text = src.read_text(encoding='utf-8')
          for token in ('lucky-12', 'lucky-13', 'lucky-22', 'pet-7', 'pass-5', 'package-3', 'legend-3'):
              if token not in text:
                  raise SystemExit('Missing Taiwan status record: ' + token)
          page = html.read_text(encoding='utf-8')
          old_tag = '<script defer src="assets/js/app.js?v=20261105-ui"></script>'
          new_tag = '<script defer src="data/tw-update-20261125.js?v=20261125-tw-s1"></script>'
          if page.count(old_tag) != 1:
              raise SystemExit('Could not find unique app.js script tag in generated index.html')
          if new_tag not in page:
              page = page.replace(old_tag, new_tag + old_tag)
          old_catalog = 'src="data/catalog-update-20260917.js"'
          if old_catalog in page:
              page = page.replace(old_catalog, 'src="data/catalog-update-20260917.js?v=20261125-tw-s1"')
          if page.count(new_tag) != 1 or page.index(new_tag) > page.index(old_tag):
              raise SystemExit('Taiwan update script load order invalid')
          for p in ('image/pass-5.webp','image/lucky-12.webp','image/lucky-13.webp',
                    'image/lucky-22.webp','image/pet-7.webp','image/package-3.webp',
                    'assets/normalized/legend/03_holy_lucete_regular.webp',
                    'assets/normalized/legend/03_holy_lucete_hooded.webp'):
              f = root / p
              if not f.is_file() or not f.stat().st_size:
                  raise SystemExit('Missing previously committed appearance image: ' + p)
          html.write_text(page, encoding='utf-8')
          print('TW 11/25 script loaded before app.js; existing artwork verified')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
