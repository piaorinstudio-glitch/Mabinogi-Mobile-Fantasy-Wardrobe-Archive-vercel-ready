
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build lightweight website
        run: |
          mkdir -p site-dist
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/site-dist/' \
            --exclude='/image/actions/' \
            --exclude='/data/actions.js' \
            --exclude='/assets/js/action-gallery.js' \
            --exclude='/research/' \
            --exclude='/docs/' \
            --exclude='/scripts/' \
            --exclude='/*.py' \
            --exclude='/*.json' \
            --exclude='/*.txt' \
            ./ site-dist/
          touch site-dist/.nojekyll
          du -sh site-dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
