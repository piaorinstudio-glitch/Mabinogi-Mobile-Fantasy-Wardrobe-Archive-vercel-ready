
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Cache action videos
        uses: actions/cache@v4
        with:
          path: action-video-cache
          key: action-mp4-${{ hashFiles('scripts/build_action_site.py', 'GIF_MANIFEST.json') }}

      - name: Build optimized website
        run: |
          python3 scripts/build_action_site.py
          du -sh site-dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
